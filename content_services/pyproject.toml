[tool.poetry]
name = "hatchet-python"
version = "0.1.0"
description = "Run Hatchet Workflows"
authors = ["driver"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
aws-secretsmanager-caching = "^1.1.3"
openai = "1.99.1"
tiktoken = "^0.12.0"
tqdm = "^4.66.4"
boto3 = "^1.34.141"
database = {path = "../driver_db", develop = true}
pydantic = {extras = ["email"], version = "^2.12.4"}
pydantic-settings = "^2.3.3"
pymupdf = "^1.25.5"
pymupdf4llm = "0.0.17"
google-genai = "^1.9.0"
shared = {path = "../packages/shared", develop = true}
duckdb = "^1.1.0"
pyarrow = "^18.0.0"
pandas = "^2.0.0"
chardet = "^5.2.0"
requests = "^2.32.3"
sendgrid = "^6.11.0"
pyjwt = "^2.10.1"
httpx = "^0.28.1"
tree-sitter-c = "0.23.4"
tree-sitter-cpp = "0.23.2"
tree-sitter-java = "^0.23.5"
tree-sitter-c-sharp = "^0.23.1"
tree-sitter-typescript = "^0.23.2"
pillow = "^10.4.0"
modal = "^1.0.4"
aiolimiter = "^1.2.1"
tree-sitter = "^0.25.1"
tree-sitter-go = "^0.25.0"
tree-sitter-python = "^0.25.0"
pygit2 = "^1.18.2"
notion-client = "^2.4.0"
sentry-sdk = "^2.0.0"
hatchet-sdk = "^1.20.0"
greenlet = "^3.2.4"
auth0-python = "^4.13.0"
truststore = "^0.10.4"
tree-sitter-ruby = "^0.23.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
moto = {extras = ["all", "ec2", "s3"], version = "^5.0.9"}
pytest-asyncio = "^0.23.7"
python-dotenv = "^1.0.1"
ipython = "^8.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
simple = "src.run:main"
worker = "src.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
