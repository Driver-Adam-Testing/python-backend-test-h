[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Admin <admin@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
fastapi = "^0.128.0"
python-multipart = "^0.0.20"
tenacity = "^8.2.3"
pydantic = ">2.0"

#TODO: Do we need gunicorn?
gunicorn = "^23.0.0"

# Pin bcrypt until passlib supports the latest
bcrypt = "4.0.1"
pydantic-settings = "^2.2.1"
database = { path = "../driver_db", develop = true }
shared = { path = "../packages/shared", develop = true }
strawberry-graphql = { extras = ["fastapi"], version = "^0.262.6" }
auth0-python = "^4.7.1"
boto3 = "^1.34.114"
moto = "^5.0.9"
aws-cdk-lib = "^2.144.0"
constructs = "^10.3.0"
tiktoken = "^0.12.0"
pypandoc-binary = "^1.14"
python-gitlab = "^5.6.0"
pyjwt = "^2.10.1"
sentry-sdk = { version = "^2.22.0", extras = ["fastapi"] }
cachetools = "^6.0.0"
httpx = "^0.28.1"
disposable-email-domains = "^0.0.132"
truststore = "^0.10.4"
hatchet-sdk = "^1.21.5"
fastmcp = "^2.13.3"
py-key-value-aio = {extras = ["redis"], version = "^0.3.0"}


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.2"
pytest-mock = "^3.12.0"
fastapi-cli = "^0.0.4"
pytest-asyncio = "<1.0"
testcontainers = {extras = ["postgres"], version = "^4.13.2"}


[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.mypy]
strict = true
exclude = ["venv", "alembic"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests with mocked dependencies (default)",
    "integration: Integration tests with real database (in-memory SQLite)"
]
addopts = "--cov --cov-report=term-missing --cov-report=xml:coverage/coverage.xml"

[tool.coverage]
omit = ["**/*_test.py", "**/tests/**"]
